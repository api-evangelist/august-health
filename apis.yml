aid: august-health
name: August Health
description: >-
  August Health is an AI-enabled electronic health record (EHR) platform purpose-built for
  senior living and eldercare communities, spanning Move-Ins, EHR, eMAR, Care Track, Billing
  & Payments, and Insights. It publishes a RESTful v1 API and a developer portal
  (developer.augusthealth.com) that lets integration partners read and write resident,
  clinical, medication, billing, and census data, plus a webhook event surface for
  resident-lifecycle and billing events. Auth is bearer-JWT with named permissions; the
  platform is SOC 2 (AICPA) and HIPAA certified. August Health is backed by General Catalyst
  and Matrix Partners.
