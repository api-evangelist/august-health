          $ref: '#/components/schemas/com.august.protos.incidents.AlertFrequency'
          description: The shift-based alerting frequency. Mutually exclusive with alertFrequencyInMinutes.
        alertFrequencyInMinutes:
          description: The legacy minutes-based alerting frequency. When both this and alertFrequency are unspecified, it should be interpreted as "as needed". Mutually exclusive with alertFrequency.
