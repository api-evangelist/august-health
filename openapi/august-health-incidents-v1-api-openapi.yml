            schema:
              discriminator:
                mapping:
                  INCIDENT: '#/components/schemas/com.august.api.integrations.models.incidents.v1.PatchIncidentOrNoteRequest.PatchIncidentRequest'
                  NOTE: '#/components/schemas/com.august.api.integrations.models.incidents.v1.PatchIncidentOrNoteRequest.PatchNoteRequest'
                propertyName: type
              oneOf:
              - $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.PatchIncidentOrNoteRequest.PatchIncidentRequest'
              - $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.PatchIncidentOrNoteRequest.PatchNoteRequest'
          application/merge-patch+json:
            schema:
              discriminator:
                mapping:
                  INCIDENT: '#/components/schemas/com.august.api.integrations.models.incidents.v1.PatchIncidentOrNoteRequest.PatchIncidentRequest'
                  NOTE: '#/components/schemas/com.august.api.integrations.models.incidents.v1.PatchIncidentOrNoteRequest.PatchNoteRequest'
                propertyName: type
              oneOf:
              - $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.PatchIncidentOrNoteRequest.PatchIncidentRequest'
              - $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.PatchIncidentOrNoteRequest.PatchNoteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.IncidentOrNote'
                type: object
          description: Successfully updated an existing incident.
      summary: Update an incident
      tags:
      - Incidents (v1)
