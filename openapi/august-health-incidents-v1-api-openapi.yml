openapi: 3.2.0
info:
  title: August Health Integrations Incidents (v1) API
  version: '1.0'
servers:
- url: https://integrations.staging.augusthealth.com
security:
- BearerAuth: []
tags:
- name: Incidents (v1)
paths:
  /v1/organizations/{orgId}/facilities/{facilityId}/incidents:
    get:
      description: Returns a paginated list of all incidents and notes for all residents at a facility. Results are sorted by alert status (alerts first), then by creation time (newest first).
      operationId: listFacilityIncidentsV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - description: Comma-separated list of fields to include in the response
        in: query
        name: fields
        required: false
        schema:
          type: string
      - description: Filter for incidents on or after this date (inclusive)
        in: query
        name: startDate
        required: false
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: Filter for incidents on or before this date (inclusive)
        in: query
        name: endDate
        required: false
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: Filter for incidents updated after this timestamp (ISO 8601 format with timezone)
        in: query
        name: updatedAfter
        required: false
        schema:
          example: '2024-01-15T10:30:00Z'
          format: date-time
          type: string
      - description: Maximum number of results to return (default 100, max 200)
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          maximum: 200
          type: integer
      - description: Number of results to skip (default 0)
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.IncidentOrNote'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully retrieved incidents.
        '400':
          description: Invalid request parameters (e.g., limit exceeds 200, startDate after endDate)
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to read incidents at this facility
      summary: List incidents and notes for a facility
      tags:
      - Incidents (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/incidents:
    post:
      operationId: createIncidentV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              discriminator:
                mapping:
                  INCIDENT: '#/components/schemas/com.august.api.integrations.models.incidents.v1.CreateIncidentOrNoteRequest.CreateIncidentRequest'
                  NOTE: '#/components/schemas/com.august.api.integrations.models.incidents.v1.CreateIncidentOrNoteRequest.CreateNoteRequest'
                propertyName: type
              oneOf:
              - $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.CreateIncidentOrNoteRequest.CreateIncidentRequest'
              - $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.CreateIncidentOrNoteRequest.CreateNoteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.IncidentOrNote'
                type: object
          description: Successfully created a new incident or note.
      summary: Create an incident
      tags:
      - Incidents (v1)
    get:
      description: Returns a paginated list of incidents and notes for a specific person. Results are sorted by alert status (alerts first), then by creation time (newest first).
      operationId: listPersonIncidentsV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - description: Comma-separated list of fields to include in the response
        in: query
        name: fields
        required: false
        schema:
          type: string
      - description: Filter for incidents on or after this date (inclusive)
        in: query
        name: startDate
        required: false
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: Filter for incidents on or before this date (inclusive)
        in: query
        name: endDate
        required: false
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: Maximum number of results to return (default 100)
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
      - description: Number of results to skip (default 0)
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.IncidentOrNote'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully retrieved incidents.
        '400':
          description: Invalid request parameters (e.g., startDate after endDate)
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to read incidents for this person
        '404':
          description: Person not found
      summary: List incidents and notes for a person
      tags:
      - Incidents (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/incidents/{id}:
    get:
