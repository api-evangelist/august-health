openapi: 3.2.0
info:
  title: August Health Integrations Contacts (v1) API
  version: '1.0'
servers:
- url: https://integrations.staging.augusthealth.com
security:
- BearerAuth: []
tags:
- name: Contacts (v1)
paths:
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/contacts:
    post:
      description: Create a new contact for a person.
      operationId: createContactV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.august.api.integrations.models.contacts.v1.CreateContactRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.contacts.v1.Contact'
                type: object
          description: The newly created contact.
      summary: Create contact
      tags:
      - Contacts (v1)
    get:
      description: List contacts for person.
      operationId: listContactsV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - description: The comma-delimited list of fields to retrieve.
        in: query
        name: fields
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.contacts.v1.Contact'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully listed contacts.
      summary: List contacts
      tags:
      - Contacts (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/contacts/{contactId}:
    get:
      description: Get details for a specific contact.
      operationId: getContactV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - in: path
        name: contactId
        required: true
        schema:
          type: string
      - description: The comma-delimited list of fields to retrieve.
        in: query
        name: fields
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.contacts.v1.Contact'
                type: object
          description: The specified contact's details.
      summary: Get contact
      tags:
      - Contacts (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/contacts/{contactId}/responsiblePerson:
    put:
      operationId: setResponsiblePersonV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - in: path
        name: contactId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successfully set the specified Contact as the Responsible Person for the given Person.
        '403':
          description: User does not have the IntegrationsApiContactsV1Access feature flag enabled or does not have permission to set Contact as the Responsible Person.
      summary: Sets the specified Contact as the Responsible Person for a given Person
      tags:
      - Contacts (v1)
