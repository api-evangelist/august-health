openapi: 3.2.0
info:
  title: August Health Integrations Residents (v1) API
  version: '1.0'
servers:
- url: https://integrations.staging.augusthealth.com
security:
- BearerAuth: []
tags:
- name: Residents (v1)
paths:
  /v1/organizations/{orgId}/facilities/{facilityId}/people:
    post:
      description: Create a resident within a specific facility. Supplying an external ID already used in the facility returns a 400 confirmation-required error unless `allowDuplicateExternalIds=true`.
      operationId: createPersonV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - description: Create the resident even if another prospect or current resident in the same facility already has one of the supplied external IDs.
        in: query
        name: allowDuplicateExternalIds
        required: false
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.august.api.integrations.models.people.v1.CreatePersonRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.people.v1.Person'
                type: object
          description: Successfully created a new resident.
        '400':
          content:
            application/json:
              example:
                errors:
                - data:
                    confirmationRequired: true
                    conflicts:
                    - field: yardiResidentId
                      personIds:
                      - '4521'
                      value: t0012345
                  message: Another prospect or current resident in this facility already has this external ID. Resend the request with allowDuplicateExternalIds=true to proceed anyway.
          description: Invalid request, or confirmation required (`data.confirmationRequired` is `true`) because a supplied external ID is already in use in this facility. Nothing is created. Resend with `allowDuplicateExternalIds=true` to create the resident anyway.
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to create residents in this facility
      summary: Create Person
      tags:
      - Residents (v1)
    get:
      description: Lists all residents within a facility
      operationId: listPeopleV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: residentStatus
        required: false
        schema:
          $ref: '#/components/schemas/com.august.protos.person.ResidentStatus'
      - in: query
        name: fields
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.people.v1.Person'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully listed residents.
      summary: List People
      tags:
      - Residents (v1)
