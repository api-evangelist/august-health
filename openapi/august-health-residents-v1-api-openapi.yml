    patch:
      description: Partially update a resident with a JSON Merge Patch (RFC 7396). Omitted fields are unchanged, `null` clears a field, objects are merged recursively, and arrays are replaced whole. Setting an external ID already used in the facility returns a 400 confirmation-required error unless `allowDuplicateExternalIds=true`.
      operationId: patchPersonV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - description: Apply the update even if another prospect or current resident in the same facility already has one of the external IDs being set. Does not bypass any other validation.
        in: query
        name: allowDuplicateExternalIds
        required: false
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.august.api.integrations.models.people.v1.PatchPersonRequest'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/com.august.api.integrations.models.people.v1.PatchPersonRequest'
        required: true
      responses:
        '204':
          description: Successfully updated the resident. Use Get Person to read the result.
        '400':
          content:
            application/json:
              example:
                errors:
                - data:
                    confirmationRequired: true
                    conflicts:
                    - field: yardiResidentId
                      personIds:
                      - '4521'
                      value: t0012345
                  message: Another prospect or current resident in this facility already has this external ID. Resend the request with allowDuplicateExternalIds=true to proceed anyway.
          description: Invalid request, or confirmation required (`data.confirmationRequired` is `true`) because an external ID is already in use in this facility. Resend with `allowDuplicateExternalIds=true` to apply the update anyway.
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to update this resident
        '404':
          description: Resident not found
        '415':
          description: Unsupported content type
      summary: Update Person
      tags:
      - Residents (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/profilePhoto:
    get:
      description: Returns the profile photo for a resident as a binary image (168x168). Supports ETag-based caching via the If-None-Match header.
      operationId: getPersonProfilePhotoV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - description: ETag value from a previous response. If the photo has not changed, a 304 Not Modified is returned.
        in: header
        name: If-None-Match
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            image/*:
              schema:
                format: binary
                type: string
          description: Profile photo binary image.
          headers:
            Cache-Control:
              description: Caching directive for the response.
              schema:
                type: string
            ETag:
              description: Identifier for this version of the photo. Use with If-None-Match on subsequent requests.
              schema:
                type: string
        '304':
          description: Photo has not changed since the ETag provided in If-None-Match.
        '404':
          description: No profile photo exists for this resident.
      summary: Get Person Profile Photo
      tags:
      - Residents (v1)
