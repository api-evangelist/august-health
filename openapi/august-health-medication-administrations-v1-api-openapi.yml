openapi: 3.2.0
info:
  title: August Health Integrations Medication Administrations (v1)…
  version: '1.0'
servers:
- url: https://integrations.staging.augusthealth.com
security:
- BearerAuth: []
tags:
- name: Medication Administrations (v1)
paths:
  /v1/organizations/{orgId}/facilities/{facilityId}/medicationAdministrations:
    get:
      description: Returns a paginated list of all medication administrations for all residents at a facility.
      operationId: listFacilityMedicationAdministrationsV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - description: Filter for administrations on this med pass date
        in: query
        name: medPassDate
        required: true
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: Filter for administrations belonging to this order group
        in: query
        name: orderGroupId
        required: false
        schema:
          format: uuid
          type: string
      - description: Maximum number of results to return (default 500, max 5000)
        in: query
        name: limit
        required: false
        schema:
          default: 500
          format: int32
          maximum: 5000
          type: integer
      - description: Number of results to skip (default 0)
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.medication_administrations.v1.MedicationAdministration'
                    type: array
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                    - description: 'Note: the total count reflects the number of records in the database and may be slightly higher than the number of items returned if any administrations have unrecognized statuses.'
                type: object
          description: Successfully retrieved medication administrations.
        '400':
          description: Invalid request parameters
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to read medication administrations at this facility
      summary: List all medication administrations for all residents of a facility
      tags:
      - Medication Administrations (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/medicationAdministrations:
    get:
      description: Returns a paginated list of all medication administrations for a specific person.
      operationId: listPersonMedicationAdministrationsV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - description: Filter for administrations on this med pass date
        in: query
        name: medPassDate
        required: true
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: Maximum number of results to return (default 500, max 5000)
        in: query
        name: limit
        required: false
        schema:
          default: 500
          format: int32
          maximum: 5000
          type: integer
      - description: Number of results to skip (default 0)
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.medication_administrations.v1.MedicationAdministration'
                    type: array
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                    - description: 'Note: the total count reflects the number of records in the database and may be slightly higher than the number of items returned if any administrations have unrecognized statuses.'
                type: object
          description: Successfully retrieved medication administrations.
        '400':
          description: Invalid request parameters
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to read medication administrations for this person
        '404':
          description: Person not found
      summary: List all medication administrations for a person
      tags:
      - Medication Administrations (v1)
components:
  schemas:
    com.august.api.integrations.models.medication_administrations.v1.Performer:
      properties:
        name:
          description: Full name of the performer
          type: string
        userId:
          description: The user account ID of the performer
          type: string
      required:
      - userId
      - name
    com.august.api.integrations.models.common.ApiResponseMetadata:
      properties:
        limit:
          description: The limit used for a paginated request for the query
          format: int32
          type: integer
        offset:
          description: The offset used for a paginated request for the query
          format: int32
          type: integer
        total:
          description: The total number of available items for the query
          format: int32
          type: integer
      required:
      - total
      - limit
      - offset
    com.august.api.integrations.models.medication_administrations.v1.MedicationAdministration:
      properties:
        administeredDosage:
          $ref: '#/components/schemas/com.august.api.integrations.models.medication_administrations.v1.AdministeredDosage'
          description: The dosage that was actually administered
        beginScheduledTime:
          description: Start of the scheduled administration window
          format: date-time
          type: string
        dosageType:
          $ref: '#/components/schemas/com.august.protos.medication_statement.DosageType'
          description: The type of dosage for the associated order (e.g. standing, PRN)
        endScheduledTime:
          description: End of the scheduled administration window
          format: date-time
          type: string
        id:
          description: Unique identifier for this administration record
          type: string
        isOutsideProviderAdministered:
          description: Whether the medication was administered by an outside provider
          type: boolean
        medPassDate:
          example: '2020-01-01'
          format: date
          type: string
        medPassId:
          description: The med pass this administration is part of
          type: string
        medicationOrderId:
          description: The medication order this administration is associated with
          type: string
        note:
          description: Additional notes about the administration
          type: string
        occurredAt:
          description: When the administration actually occurred
          format: date-time
          type: string
        orderGroupId:
          description: The order group this administration belongs to
          type: string
        performer:
          $ref: '#/components/schemas/com.august.api.integrations.models.medication_administrations.v1.Performer'
          description: The person who performed the administration
        personId:
          description: The resident receiving the medication
          type: string
        reasonForException:
          $ref: '#/components/schemas/com.august.protos.medication_administration.ReasonForException'
          description: Reason the medication was not administered, if applicable
        reasonForOutOfSchedule:
          $ref: '#/components/schemas/com.august.protos.medication_administration.ReasonForOutOfSchedule'
          description: Reason for out-of-schedule administration, if applicable
        recordedAt:
          description: When the administration was recorded in the system
          format: date-time
          type: string
        selfAdministered:
          description: Whether the resident self-administered the medication
          type: boolean
        status:
          $ref: '#/components/schemas/com.august.api.integrations.models.medication_administrations.v1.AdministrationStatus'
          description: Current status of the administration
        wasAdministeredOutOfSchedule:
          description: Whether this administration occurred outside the scheduled time
          type: boolean
      required:
      - id
      - medicationOrderId
      - personId
      - orderGroupId
      - status
      - dosageType
      - wasAdministeredOutOfSchedule
      - selfAdministered
      - isOutsideProviderAdministered
    com.august.api.integrations.models.medication_administrations.v1.AdministrationStatus:
      enum:
      - SCHEDULED
      - ADMINISTERED
      - NOT_ADMINISTERED
      - ON_HOLD
      type: string
    com.august.protos.medication_administration.ReasonForException:
      oneOf:
      - enum:
        - REASON_FOR_EXCEPTION_OUT_OF_FACILITY
        - REASON_FOR_EXCEPTION_RESIDENT_REFUSED
        - REASON_FOR_EXCEPTION_MEDICATION_NOT_AVAILABLE
        - REASON_FOR_EXCEPTION_WITHHELD_PER_DOCTORS_REQUEST
        - REASON_FOR_EXCEPTION_CHANGING_SCHEDULE
        - REASON_FOR_EXCEPTION_HELD_FOR_CONDITIONAL_PARAMETERS
        - REASON_FOR_EXCEPTION_HELD_BY_SLIDING_SCALE
        - REASON_FOR_EXCEPTION_INVALID_ORDER
        - REASON_FOR_EXCEPTION_RESIDENT_UNABLE_TO_SWALLOW_NON_DEDUCTING
        - REASON_FOR_EXCEPTION_GIVEN_BY_HOME_HEALTH_NON_DEDUCTING
        - REASON_FOR_EXCEPTION_GIVEN_TO_FAMILY_TO_GIVE_LATER_NON_DEDUCTING
        - REASON_FOR_EXCEPTION_OTHER
        title: values
        type: string
      - deprecated: true
        enum:
        - REASON_FOR_EXCEPTION_GIVEN_BY_HOME_HEALTH
        - REASON_FOR_EXCEPTION_GIVEN_TO_FAMILY_TO_GIVE_LATER
        - REASON_FOR_EXCEPTION_RESIDENT_UNABLE_TO_SWALLOW
        title: deprecated values
        type: string
    com.august.api.integrations.models.medication_administrations.v1.AdministeredDosage:
      properties:
        quantity:
          $ref: '#/components/schemas/com.august.api.integrations.models.medication_administrations.v1.SimpleQuantity'
          description: The measured dose quantity that was administered
        text:
          description: Free-text dosage instructions or description
          type: string
    com.august.protos.medication_statement.DosageType:
      enum:
      - DOSAGE_TYPE_ROUTINE
      - DOSAGE_TYPE_PRN
      - DOSAGE_TYPE_SPLIT
      - DOSAGE_TYPE_TAPER
      - DOSAGE_TYPE_SLIDING_SCALE
      - DOSAGE_TYPE_VITAL
      type: string
    com.august.protos.medication_administration.ReasonForOutOfSchedule:
      enum:
      - REASON_FOR_OUT_OF_SCHEDULE_LATE_ENTRY
      - REASON_FOR_OUT_OF_SCHEDULE_RESIDENT_APPOINTMENT
      - REASON_FOR_OUT_OF_SCHEDULE_WIFI_NOT_WORKING
      - REASON_FOR_OUT_OF_SCHEDULE_CHARTING_SYSTEM_NOT_WORKING
      type: string
    com.august.api.integrations.models.medication_administrations.v1.SimpleQuantity:
      properties:
        unit:
          description: Unit of measurement (e.g. "mg", "mL", "tablets")
          type: string
        value:
          description: Numeric value of the quantity
          format: double
          type: number
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
