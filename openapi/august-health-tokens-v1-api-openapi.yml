openapi: 3.2.0
info:
  title: August Health Integrations Tokens (v1) API
  version: '1.0'
servers:
- url: https://integrations.staging.augusthealth.com
security:
- BearerAuth: []
tags:
- name: Tokens (v1)
paths:
  /v1/token:
    post:
      operationId: createTokenV1
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/com.august.api.integrations.models.tokens.v1.CreateTokenRequest.CreateTokenWithUserCredentials'
              - $ref: '#/components/schemas/com.august.api.integrations.models.tokens.v1.CreateTokenRequest.CreateTokenWithRefreshCredentials'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.tokens.v1.CreateTokenResponse'
                type: object
          description: Successfully created a new API token.
        '429':
          description: Too many requests.
      security: []
      summary: Create an API token for programmatic access for August Health API
      tags:
      - Tokens (v1)
components:
  schemas:
    com.august.api.integrations.models.tokens.v1.CreateTokenRequest.CreateTokenWithRefreshCredentials:
      properties:
        refreshCredentials:
          $ref: '#/components/schemas/com.august.api.integrations.models.tokens.v1.RefreshCredentials'
      required:
      - refreshCredentials
    com.august.api.integrations.models.tokens.v1.RefreshCredentials:
      properties:
        idToken:
          minLength: 1
          type: string
        refreshToken:
          minLength: 1
          type: string
      required:
      - idToken
      - refreshToken
    com.august.api.integrations.models.tokens.v1.CreateTokenRequest.CreateTokenWithUserCredentials:
      properties:
        credentials:
          properties:
            password:
              format: password
              minLength: 1
              type: string
            username:
              minLength: 1
              type: string
          required:
          - username
          - password
          type: object
      required:
      - credentials
    com.august.api.integrations.models.tokens.v1.CreateTokenResponse:
      properties:
        expiresIn:
          description: The expiration period in seconds.
          format: int32
          type: integer
        idToken:
          description: The authentication id token for the user
          type: string
        refreshToken:
          description: The refresh token for the user. This can be used to obtain another id token using the [](RefreshCredentials) token auth flow. Currently, this field will only be specified when using the [](UserCredentials) token auth flow. Once the refresh token has expired a new [](UserCredentials) token auth flow must be initiated to get a new refresh token.
          type: string
        tokenType:
          type: string
      required:
      - expiresIn
      - idToken
      - tokenType
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
