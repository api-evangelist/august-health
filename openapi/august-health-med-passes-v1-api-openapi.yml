info:
  title: August Health Integrations Med Passes (v1) API
  version: '1.0'
servers:
- url: https://integrations.staging.augusthealth.com
security:
- BearerAuth: []
tags:
- name: Med Passes (v1)
paths:
  /v1/organizations/{orgId}/facilities/{facilityId}/medPasses:
    get:
      description: List med passes in a given facility.
      operationId: listMedPassesV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.med_passes.v1.MedPass'
                    type: array
                type: object
          description: Successfully listed med passes.
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to read med passes at this facility
      summary: List facility med passes
      tags:
      - Med Passes (v1)
components:
  schemas:
    com.august.api.integrations.models.med_passes.v1.MedPass:
      properties:
        endTime:
          example: '15:30:00'
          format: time-local
          type: string
        id:
          description: Unique identifier for the med pass.
          type: string
        name:
          description: Display name of the med pass (e.g. "Morning", "Bedtime").
          type: string
        startTime:
          example: '15:30:00'
          format: time-local
          type: string
      required:
      - id
      - name
      - startTime
      - endTime
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
