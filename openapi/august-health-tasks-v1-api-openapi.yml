openapi: 3.2.0
info:
  title: August Health Integrations Tasks (v1) API
  version: '1.0'
servers:
- url: https://integrations.staging.augusthealth.com
security:
- BearerAuth: []
tags:
- name: Tasks (v1)
paths:
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/tasks:
    get:
      description: List tasks for a specific person.
      operationId: listTasksV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - description: Filter for open tasks (true), closed tasks (false), or all tasks (absent).
        in: query
        name: open
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.tasks.v1.Task'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully listed tasks.
      summary: List tasks
      tags:
      - Tasks (v1)
