openapi: 3.2.0
info:
  title: August Health Integrations Facilities (v1) API
  version: '1.0'
servers:
- url: https://integrations.staging.augusthealth.com
security:
- BearerAuth: []
tags:
- name: Facilities (v1)
paths:
  /v1/organizations/{orgId}/facilities:
    get:
      description: List facilities visible to the current user in a given organization.
      operationId: listFacilitiesV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.facilities.v1.Facility'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully listed facilities.
      summary: List facilities
      tags:
      - Facilities (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/rooms:
    get:
      description: Returns all active rooms for the specified facility, including configured beds and market rates. Optionally filter by effective date.
      operationId: listRoomsV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: query
        name: effectiveDate
        required: false
        schema:
          example: '2020-01-01'
          format: date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.rooms.v1.Room'
                    type: array
                type: object
          description: Successfully listed rooms.
      summary: List rooms for a facility
      tags:
      - Facilities (v1)
components:
  schemas:
    com.august.api.integrations.models.common.ApiResponseMetadata:
      properties:
        limit:
          description: The limit used for a paginated request for the query
          format: int32
          type: integer
        offset:
          description: The offset used for a paginated request for the query
          format: int32
          type: integer
        total:
          description: The total number of available items for the query
          format: int32
          type: integer
      required:
      - total
      - limit
      - offset
    com.august.api.integrations.models.facilities.v1.Facility:
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
    com.august.protos.admissions.AdmissionsInformation.AdmissionType:
      enum:
      - ADMISSION_TYPE_ASSISTED_LIVING
      - ADMISSION_TYPE_MEMORY_CARE
      - ADMISSION_TYPE_INDEPENDENT_LIVING
      type: string
    com.august.api.integrations.models.common.Measurement:
      properties:
        unit:
          type: string
        value:
          format: double
          type: number
      required:
      - value
      - unit
    com.august.api.integrations.models.rooms.v1.Room:
      properties:
        admissionType:
          $ref: '#/components/schemas/com.august.protos.admissions.AdmissionsInformation.AdmissionType'
          description: The admission type assigned to this room.
        area:
          $ref: '#/components/schemas/com.august.api.integrations.models.common.Measurement'
          description: The room's floor area in square feet (permission-gated; only included when the caller has the room marketing read permission).
        beds:
          description: Configured beds for this room.
          items:
            $ref: '#/components/schemas/com.august.api.integrations.models.common.Bed'
            description: Configured beds for this room.
          type: array
        description:
          description: Free-form marketing description of the room (permission-gated; only included when the caller has the room marketing read permission).
          type: string
        externalId:
          description: The room's ID in the external system that manages the facility's rooms.
          type: string
        marketRates:
          description: Active market rates for this room (permission-gated; only included when the caller has the room marketing read permission).
          items:
            $ref: '#/components/schemas/com.august.api.integrations.models.rooms.v1.RoomMarketRate'
            description: Active market rates for this room (permission-gated; only included when the caller has the room marketing read permission).
          type: array
        roomId:
          description: Unique identifier for the room.
          type: string
        roomName:
          description: Human-readable name of the room.
          type: string
      required:
      - roomId
      - roomName
      - beds
    com.august.api.integrations.models.rooms.v1.RoomMarketRate:
      properties:
        admissionType:
          $ref: '#/components/schemas/com.august.protos.admissions.AdmissionsInformation.AdmissionType'
        endDate:
          example: '2020-01-01'
          format: date
          type: string
        occupancyType:
          enum:
          - PRIVATE
          - SHARED
          - SECOND_OCCUPANT
          type: string
        rateCents:
          format: int32
          type: integer
        startDate:
          example: '2020-01-01'
          format: date
          type: string
      required:
      - occupancyType
      - rateCents
      - startDate
    com.august.api.integrations.models.common.Bed:
      properties:
        externalId:
          description: The bed's ID in the external system that manages the facility's rooms and beds.
          type: string
        id:
          description: The bed's unique identifier.
          type: string
        name:
          description: The bed's display name. Empty for single-occupancy rooms; only populated when the room's occupancy is greater than 1.
          type: string
      required:
      - id
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
