info:
  title: August Health Integrations API
  version: '1.0'
openapi: 3.1.0
security:
- BearerAuth: []
servers:
- url: https://integrations.staging.augusthealth.com
paths:
  /v1/organizations:
    get:
      description: List organizations visible to the current user.
      operationId: listOrganizationsV1
      parameters:
      - description: Maximum number of results to return
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          maximum: 500
          type: integer
      - description: Number of results to skip
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.organizations.v1.Organization'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully listed organizations.
        '400':
          description: Invalid request parameters (e.g., negative values)
        '401':
          description: Authentication required
      summary: List organizations
      tags:
      - Organizations (v1)
  /v1/organizations/{orgId}/facilities:
    get:
      description: List facilities visible to the current user in a given organization.
      operationId: listFacilitiesV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.facilities.v1.Facility'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully listed facilities.
      summary: List facilities
      tags:
      - Facilities (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/admissions:
    get:
      description: Returns paginated admission and discharge history for all residents in the specified facility
      operationId: getFacilityAdmissionHistoryV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.admissions.v1.GetAdmissionHistoryResponse'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully retrieved facility admission history.
      summary: Get admission history for all residents in a facility
      tags:
      - Occupancy (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/bedAssignments:
    get:
      description: Returns paginated bed assignment history for all residents in the specified facility
      operationId: getFacilityBedAssignmentHistoryV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.bed_assignments.v1.ListBedAssignmentsResponse'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully retrieved facility bed assignment history.
      summary: Get bed assignment history for all residents in a facility
      tags:
      - Occupancy (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/billing/charges:
    post:
      description: 'Submit a batch of one-time charges/credits for residents in a facility.


        Each charge lands as a pending ledger entry on the resident''s transaction log.'
      operationId: recordChargesV1
      parameters:
      - description: August organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: August facility ID
        in: path
        name: facilityId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.august.api.integrations.models.billing_charges.v1.RecordChargesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.billing_charges.v1.RecordChargesResponse'
                type: object
          description: All charges already existed (idempotent response)
        '201':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.billing_charges.v1.RecordChargesResponse'
                type: object
          description: At least one charge was created
        '400':
          description: Invalid request data
        '401':
          description: Invalid or missing credentials
        '403':
          description: Insufficient permissions
      summary: Record one-time charges
      tags:
      - Billing (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/billing/deposits:
    post:
      description: 'Integration partners submit collected payments as a consolidated deposit.


        **Authentication**: Bearer token (JWT) required with `BILLING_PAYMENTS_CREATE` permission.


        **Idempotency**: If the same `externalDepositId` is resubmitted,

        returns the existing deposit without creating duplicates.

        The retry must contain the exact same set of payments (by `externalTransactionId`);

        mismatched payments return a `400` error.


        **Atomicity**: All payments in the batch succeed or none do.

        If any `personId` is invalid, the entire batch is rejected.


        **Payment Types**:

        - `PAYMENT`: Standard payment (amount must be positive)

        - `PAYMENT_RETURN`: Returned payment, e.g., NSF (amount must be negative)

        - `REFUND`: Refunded payment (amount must be negative)


        If `paymentType` is omitted, it defaults to `PAYMENT`.


        **Cash Account Code**:

        The `cashAccountCode` field controls which GL cash account is assigned to the deposit

        for accounting export purposes.

        - If the facility has GL cash accounts configured: `cashAccountCode` is **required** and must match a configured code.

        - If no GL cash accounts are configured: `cashAccountCode` **must not** be sent.

        '
      operationId: recordDepositV1
      parameters:
      - description: August organization ID
        in: path
        name: orgId
        required: true
        schema:
          format: int64
          type: integer
      - description: August facility ID
        in: path
        name: facilityId
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.august.api.integrations.models.billing_callback.v1.RecordDepositRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.billing_callback.v1.RecordDepositResponse'
                type: object
          description: Deposit already exists (idempotent response)
        '201':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.billing_callback.v1.RecordDepositResponse'
                type: object
          description: Deposit created successfully
        '400':
          description: Invalid request data (invalid personId, batch too large, invalid amount sign, etc.)
        '401':
          description: Invalid or missing credentials
        '403':
          description: Insufficient permissions
      summary: Record deposit
      tags:
      - Billing (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/billing/summaries:
    get:
      description: 'Retrieve paginated billing summaries for all residents in a facility including:

        - Resident identification and status

        - Physical and financial move-in/move-out dates

        - Latest issued statement details

        - Current balance

        - Payer contacts (contacts marked as "Payment of Care")


        Results can be filtered by resident status using the `residentStatus` query parameter.

        '
      operationId: listFacilityBillingSummariesV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - description: Maximum number of results to return
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
      - description: Number of results to skip
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - description: Filter by resident status. Defaults to RESIDENT_STATUS_CURRENT_RESIDENT.
        in: query
        name: residentStatus
        required: true
        schema:
          $ref: '#/components/schemas/com.august.protos.person.ResidentStatus'
          default: RESIDENT_STATUS_CURRENT_RESIDENT
          enum:
          - RESIDENT_STATUS_CURRENT_RESIDENT
          - RESIDENT_STATUS_PROSPECT
          - RESIDENT_STATUS_DISCHARGED
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.billing_summary.v1.ExternalBillingSummary'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Billing summaries retrieved successfully
        '401':
          description: No credentials provided
        '403':
          description: Not Authorized for this resource
      summary: List facility billing summaries
      tags:
      - Billing (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/census:
    get:
      description: Lists limited demographic information for people within a facility
      operationId: listCensusV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: residentStatus
        required: false
        schema:
          $ref: '#/components/schemas/com.august.protos.person.ResidentStatus'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.census.v1.CensusPerson'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully listed people.
        '401':
          description: No credentials provided
        '403':
          description: Not Authorized for this resource
      summary: List Census
      tags:
      - Census (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/census/{personId}:
    get:
      description: Get limited demographic information for a specific person within a facility
      operationId: getCensusPersonV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.census.v1.CensusPerson'
                type: object
          description: Successfully retrieved the person.
        '401':
          description: No credentials provided
        '403':
          description: Not Authorized for this resource
        '404':
          description: Resource not found
      summary: Get Census Person
      tags:
      - Census (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/incidents:
    get:
      description: Returns a paginated list of all incidents and notes for all residents at a facility. Results are sorted by alert status (alerts first), then by creation time (newest first).
      operationId: listFacilityIncidentsV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - description: Comma-separated list of fields to include in the response
        in: query
        name: fields
        required: false
        schema:
          type: string
      - description: Filter for incidents on or after this date (inclusive)
        in: query
        name: startDate
        required: false
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: Filter for incidents on or before this date (inclusive)
        in: query
        name: endDate
        required: false
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: Filter for incidents updated after this timestamp (ISO 8601 format with timezone)
        in: query
        name: updatedAfter
        required: false
        schema:
          example: '2024-01-15T10:30:00Z'
          format: date-time
          type: string
      - description: Maximum number of results to return (default 100, max 200)
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          maximum: 200
          type: integer
      - description: Number of results to skip (default 0)
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.incidents.v1.IncidentOrNote'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully retrieved incidents.
        '400':
          description: Invalid request parameters (e.g., limit exceeds 200, startDate after endDate)
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to read incidents at this facility
      summary: List incidents and notes for a facility
      tags:
      - Incidents (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/medPasses:
    get:
      description: List med passes in a given facility.
      operationId: listMedPassesV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.med_passes.v1.MedPass'
                    type: array
                type: object
          description: Successfully listed med passes.
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to read med passes at this facility
      summary: List facility med passes
      tags:
      - Med Passes (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/medicationAdministrations:
    get:
      description: Returns a paginated list of all medication administrations for all residents at a facility.
      operationId: listFacilityMedicationAdministrationsV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - description: Filter for administrations on this med pass date
        in: query
        name: medPassDate
        required: true
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: Filter for administrations belonging to this order group
        in: query
        name: orderGroupId
        required: false
        schema:
          format: uuid
          type: string
      - description: Maximum number of results to return (default 500, max 5000)
        in: query
        name: limit
        required: false
        schema:
          default: 500
          format: int32
          maximum: 5000
          type: integer
      - description: Number of results to skip (default 0)
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.medication_administrations.v1.MedicationAdministration'
                    type: array
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                    - description: 'Note: the total count reflects the number of records in the database and may be slightly higher than the number of items returned if any administrations have unrecognized statuses.'
                type: object
          description: Successfully retrieved medication administrations.
        '400':
          description: Invalid request parameters
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to read medication administrations at this facility
      summary: List all medication administrations for all residents of a facility
      tags:
      - Medication Administrations (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/medicationOrders:
    get:
      description: Returns a paginated list of all medication orders for all residents at a facility. Results are sorted by order ID (ascending).
      operationId: listFacilityMedicationOrdersV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - description: Filter for medication orders updated on or after this timestamp (ISO 8601 format with timezone)
        in: query
        name: updatedAfter
        required: false
        schema:
          example: '2024-01-15T10:30:00Z'
          format: date-time
          type: string
      - description: Maximum number of results to return (default 1000, max 5000)
        in: query
        name: limit
        required: false
        schema:
          default: 1000
          format: int32
          maximum: 5000
          type: integer
      - description: Number of results to skip (default 0)
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.medication_orders.v1.MedicationOrder'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully retrieved medication orders.
        '400':
          description: Invalid request parameters
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to read medication orders at this facility
      summary: List all medication orders for all residents of a facility
      tags:
      - Medication Orders (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/people:
    post:
      description: Create a resident within a specific facility. Supplying an external ID already used in the facility returns a 400 confirmation-required error unless `allowDuplicateExternalIds=true`.
      operationId: createPersonV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - description: Create the resident even if another prospect or current resident in the same facility already has one of the supplied external IDs.
        in: query
        name: allowDuplicateExternalIds
        required: false
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.august.api.integrations.models.people.v1.CreatePersonRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.people.v1.Person'
                type: object
          description: Successfully created a new resident.
        '400':
          content:
            application/json:
              example:
                errors:
                - data:
                    confirmationRequired: true
                    conflicts:
                    - field: yardiResidentId
                      personIds:
                      - '4521'
                      value: t0012345
                  message: Another prospect or current resident in this facility already has this external ID. Resend the request with allowDuplicateExternalIds=true to proceed anyway.
          description: Invalid request, or confirmation required (`data.confirmationRequired` is `true`) because a supplied external ID is already in use in this facility. Nothing is created. Resend with `allowDuplicateExternalIds=true` to create the resident anyway.
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to create residents in this facility
      summary: Create Person
      tags:
      - Residents (v1)
    get:
      description: Lists all residents within a facility
      operationId: listPeopleV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: residentStatus
        required: false
        schema:
          $ref: '#/components/schemas/com.august.protos.person.ResidentStatus'
      - in: query
        name: fields
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.people.v1.Person'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully listed residents.
      summary: List People
      tags:
      - Residents (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}:
    get:
      description: Get a specific resident within a facility
      operationId: getPersonV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - in: query
        name: fields
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  additionalScores:
                  - level: 2
                    levelName: Moderate Risk
                    score: 6
                    scoreTypeId: fall-risk
                    scoreTypeName: Fall Risk
                  address:
                  - city: Anytown
                    line:
                    - 123 Main St
                    postalCode: '12345'
                    state: CA
                    text: 123 Main St, Anytown, CA 12345
                    use: ADDRESS_USE_OLD
                  admissionsInformation:
                    admissionType: ADMISSION_TYPE_ASSISTED_LIVING
                    bedDetails:
                      endDate: '2023-10-28'
                      facilityId: '11223'
                      id: '1'
                      name: A
                      orgId: '67890'
                      roomId: '101'
                      startDate: '2023-01-01'
                    bedId: '1'
                    financialStartDate: '2023-01-01'
                    moveInStartDate: '2023-01-01'
                    roomDetails:
                      facilityId: '11223'
                      id: '101'
                      name: Room 101-A
                      orgId: '67890'
                  allergiesAndIntolerances:
                    allergies:
                    - category: ALLERGY_INTOLERANCE_CATEGORY_MEDICATION
                      summary: Penicillin - causes rash
                    - category: ALLERGY_INTOLERANCE_CATEGORY_FOOD
                      summary: Peanuts - anaphylaxis
                  ambulatoryStatus:
                    ambulatoryResult: AMBULATORY_RESULT_SEMI_AMBULATORY
                    bedStatus:
                      code: CODE_OUT_OF_BED_ALL_DAY
                      comment: Rises and retires at will
