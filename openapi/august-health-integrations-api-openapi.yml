  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/billing/statements:
    get:
      description: 'Search for issued private pay statements by billing period.

        Provide either `billingPeriod` (YYYY-MM) or both `startDate` and `endDate`, but not both.

        '
      operationId: searchStatementsV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - description: Start of the date range (inclusive) to filter by billing period (YYYY-MM-DD). Required if `billingPeriod` is not provided.
        in: query
        name: startDate
        required: false
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: End of the date range (inclusive) to filter by billing period (YYYY-MM-DD). Required if `billingPeriod` is not provided.
        in: query
        name: endDate
        required: false
        schema:
          example: '2020-01-01'
          format: date
          type: string
      - description: Monthly billing period in YYYY-MM format (e.g. 2025-01). Alternative to startDate/endDate.
        in: query
        name: billingPeriod
        required: false
        schema:
          example: 2025-01
          pattern: ^\d{4}-\d{2}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.statements.v1.StatementSearchResult'
                    type: array
                type: object
          description: List of statements within the date range
        '400':
          description: Invalid parameters (e.g. startDate is after endDate, both billingPeriod and date range provided, or neither provided)
        '403':
          description: Not Authorized for this resource
      summary: Search statements
      tags:
      - Billing (v1)
