          type: string
        id:
          description: The visitor log entry's ID.
          type: string
        personId:
          description: The resident's ID.
          type: string
        signOut:
          $ref: '#/components/schemas/com.august.api.integrations.models.visitor_logs.v1.VisitorLogSignOutResponse'
          description: Sign-out information, populated once the visit ends.
        signinAt:
          description: The instant the visitor signed in.
          format: date-time
          type: string
        visitId:
          description: External identifier that uniquely identifies the visit across systems.
          type: string
        visitType:
          description: Free-form description of the visit (e.g., "social", "medical", "delivery").
          type: string
        visitorName:
          description: Visitor's name, if recorded.
          type: string
        visitorPhone:
          description: Visitor's phone number, if recorded.
          type: string
        visitorType:
          description: Category of the visitor (e.g., "Family/Friends").
          type: string
      required:
      - id
      - personId
      - visitId
      - visitType
      - signinAt
    com.august.api.integrations.models.visitor_logs.v1.CreateVisitorLogSignOutRequest:
      properties:
        comments:
          description: Visitor-provided comments.
          type: string
        durationMinutes:
          description: Visit duration in minutes.
          format: int32
          type: integer
        rating:
          description: Visitor-provided rating.
          format: double
          type: number
        signoutAt:
          description: The instant the visitor signed out.
          format: date-time
          type: string
      required:
      - signoutAt
    com.august.api.integrations.models.visitor_logs.v1.CreateVisitorLogRequest:
      properties:
        companyName:
          description: Company associated with the visitor, if applicable.
          type: string
        signOut:
          $ref: '#/components/schemas/com.august.api.integrations.models.visitor_logs.v1.CreateVisitorLogSignOutRequest'
          description: Sign-out information, if the visit has already ended.
        signinAt:
          description: The instant the visitor signed in.
          format: date-time
          type: string
        visitId:
          description: External identifier that uniquely identifies the visit across systems.
          type: string
        visitType:
          description: Free-form description of the visit (e.g., "social", "medical", "delivery").
          type: string
        visitorName:
          description: Visitor's name, if recorded.
          type: string
        visitorPhone:
          description: Visitor's phone number, if recorded.
          type: string
        visitorType:
          description: Category of the visitor (e.g., "Family/Friends").
          type: string
      required:
      - visitId
      - visitType
      - signinAt
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
