openapi: 3.2.0
info:
  title: August Health Integrations Visitor Logs (v1) API
  version: '1.0'
servers:
- url: https://integrations.staging.augusthealth.com
security:
- BearerAuth: []
tags:
- name: Visitor Logs (v1)
paths:
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/visitorLogs:
    get:
      description: Returns a paginated list of non-deleted visitor log entries for the resident, sorted by sign-in time descending.
      operationId: listVisitorLogsV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - description: Comma-separated list of fields to include in the response
        in: query
        name: fields
        required: false
        schema:
          type: string
      - description: Maximum number of results to return
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          maximum: 500
          type: integer
      - description: Number of results to skip
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/com.august.api.integrations.models.visitor_logs.v1.VisitorLogResponse'
                    type: array
                  meta:
                    $ref: '#/components/schemas/com.august.api.integrations.models.common.ApiResponseMetadata'
                type: object
          description: Successfully retrieved visitor log entries.
        '400':
          description: Invalid request parameters (e.g., limit exceeds 500)
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to read visitor log entries for this person
      summary: List visitor log entries for a resident
      tags:
      - Visitor Logs (v1)
    post:
      description: Records a sign-in for a visitor of a resident. The request may optionally include sign-out information if the visit has already ended.
      operationId: createVisitorLogV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.august.api.integrations.models.visitor_logs.v1.CreateVisitorLogRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/com.august.api.integrations.models.visitor_logs.v1.VisitorLogResponse'
                type: object
          description: Successfully created a new visitor log entry.
        '400':
          description: Invalid request parameters
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to create visitor log entries for this person
        '404':
          description: Person not found
      summary: Create a visitor log entry
      tags:
      - Visitor Logs (v1)
  /v1/organizations/{orgId}/facilities/{facilityId}/people/{personId}/visitorLogs/{id}:
    delete:
      description: Marks a visitor log entry as deleted. Soft-deleted entries are excluded from list responses.
      operationId: deleteVisitorLogV1
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      - in: path
        name: facilityId
        required: true
        schema:
          type: string
      - in: path
        name: personId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successfully deleted the visitor log entry.
        '401':
          description: Authentication required
        '403':
          description: User lacks permission to delete visitor log entries for this person
        '404':
          description: Visitor log entry or person not found
      summary: Soft-delete a visitor log entry
      tags:
      - Visitor Logs (v1)
components:
  schemas:
    com.august.api.integrations.models.common.ApiResponseMetadata:
      properties:
        limit:
          description: The limit used for a paginated request for the query
          format: int32
          type: integer
        offset:
          description: The offset used for a paginated request for the query
          format: int32
          type: integer
        total:
          description: The total number of available items for the query
          format: int32
          type: integer
      required:
      - total
      - limit
      - offset
    com.august.api.integrations.models.visitor_logs.v1.VisitorLogSignOutResponse:
      properties:
        comments:
          description: Visitor-provided comments.
          type: string
        durationMinutes:
          description: Visit duration in minutes, if recorded.
          format: int32
          type: integer
        rating:
          description: Visitor-provided rating.
          format: double
          type: number
        signoutAt:
          description: The instant the visitor signed out.
          format: date-time
          type: string
      required:
